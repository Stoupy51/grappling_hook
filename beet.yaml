id: grappling_hook
version: 1.4.0
description: ""
author: edayot


output: build

pipeline:
  - weld_deps
  - simple_item_plugin
  - grappling_hook

require:
  - weld_deps.contrib.mecha_auto_include.require
  - bolt
  - bolt_compute
  - mecha.contrib.relative_location
  - mecha.contrib.nested_location

ignore:
  - stable_cache.json

data_pack:
  name: "{{ project_id }}_{{ project_version }}_dp_bundled"
  load: src

resource_pack:
  name: "{{ project_id }}_{{ project_version }}_rp_bundled"
  load: src

meta:
  mc_supports:
    - "26.3"
  minecraft_version: "26.3"
  modrinth_id: "bpmXxZTt"

  simple_item_plugin:
    generate_guide: true
    item_for_pack_png: "basic_grappling_hook"
    items_on_first_page: true
    load_function: "grappling_hook:impl/load"

  weld_deps:
    merge_with_weld: false
    deps:
      player_motion:
        version: "1.4.2"
        source: local
        local:
          datapack: deps/player_motion_1.4.2.zip
      crafter: "0.12.0"
      custom-block: "0.12.0"

  mecha:
    multiline: true
    match:
      - "grappling_hook:**"

  model_resolver:
    render_size: 256
    load_vanilla: true
    save_namespace: grappling_hook
    # model_resolver cannot resolve the 26.3 trim palettes yet, and only renders the guide icons
    minecraft_version: "26.2"

  smithed:
    versioning:
      scoreholder: "grappling_hook"
      scheduled_paths: "impl/tick"

      lantern_load:
        step: load
        tag_path: load
        function_path: "impl/test_load"

      refactor:
        match: "{{ project_id }}:*"
        find: "{{ project_id }}:impl/"
        replace: "{{ project_id }}:v{{ project_version }}/"

      api:
        match: "{{ project_id }}:v{{ project_version }}"
        implementation_prefix: "{{ project_id }}:v{{ project_version }}/"
        version_check_path: "v{{ project_version }}/calls"
        tag_path: calls
